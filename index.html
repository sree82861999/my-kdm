<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Periodic Table Flashcards</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(20, 28, 45, 0.85);
            --theme-color: #38bdf8;
            --theme-glow: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #34d399;
            --danger: #f87171;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0d1322 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            box-sizing: border-box;
            transition: background 0.8s ease;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            color: var(--theme-color);
            text-shadow: 0 0 20px var(--theme-glow);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        /* Flashcard Styling */
        .flashcard-container {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--theme-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: inset 0 0 15px var(--theme-glow);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .card-front-number {
            font-size: 4rem;
            font-weight: 800;
            color: var(--theme-color);
            text-shadow: 0 0 20px var(--theme-glow);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .card-front-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 5px;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-symbol {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 15px var(--theme-glow);
            margin-bottom: 2px;
        }

        .card-name {
            font-size: 1.3rem;
            color: var(--theme-color);
            font-weight: 700;
            margin-bottom: 10px;
            transition: color 0.5s ease;
        }

        .card-details {
            font-size: 0.92rem;
            line-height: 1.45;
            color: #e2e8f0;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        button.btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        button.btn-retry {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        button.btn-retry:hover {
            background: rgba(248, 113, 113, 0.25);
        }

        button.btn-gotit {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        button.btn-gotit:hover {
            background: rgba(52, 211, 153, 0.25);
        }

        .secondary-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 12px;
            flex: 1;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .keyboard-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="appTitle">🧪 Periodic Flashcards 🧪</h1>
        <p class="subtitle">Click card to flip • Guess the element from its atomic number</p>
    </header>

    <div class="container">
        <div class="stats-bar">

            <span id="scoreTracker">Mastered: 0</span>

        <div class="flashcard-container" id="cardContainer">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-front-label">Atomic Number</div>
                    <div class="card-front-number" id="frontNumber">#1</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-symbol" id="backSymbol">H</div>
                    <div class="card-name" id="backName">Hydrogen</div>
                    <div class="card-details" id="backDetails"></div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-retry" id="retryBtn">🔄 Study Again</button>
            <button class="btn btn-gotit" id="gotItBtn">✨ Mastered</button>
        </div>

        <div class="secondary-controls">
            <button class="btn btn-secondary" id="shuffleBtn">Pick Random Card</button>
            <button class="btn btn-secondary" id="resetBtn">Reset Progress</button>
        </div>

        <div class="keyboard-hint">
            ⌨️ Shortcuts: <b>Space</b> (Flip) • <b>←</b> (Study Again) • <b>→</b> (Mastered)
        </div>
    </div>

        // Color palettes (Hue values)
        const colorHues = [195, 260, 320, 140, 35, 175, 290, 15, 210, 48];

        let currentIndex = 0;
        let masteredCount = 0;
        let cardsSeen = 0;
        let isFlipped = false;

        const flashcard = document.getElementById('flashcard');
        const cardContainer = document.getElementById('cardContainer');
        const frontNumber = document.getElementById('frontNumber');
        const backSymbol = document.getElementById('backSymbol');
        const backName = document.getElementById('backName');
        const backDetails = document.getElementById('backDetails');
        const cardProgress = document.getElementById('cardProgress');
        const scoreTracker = document.getElementById('scoreTracker');

        function generateRandomTheme() {
            const randomHue = colorHues[Math.floor(Math.random() * colorHues.length)];
            const themeColor = `hsl(${randomHue}, 90%, 60%)`;
            const themeGlow = `hsla(${randomHue}, 90%, 60%, 0.4)`;
            
            document.documentElement.style.setProperty('--theme-color', themeColor);
            document.documentElement.style.setProperty('--theme-glow', themeGlow);
        }

        function pickRandomIndex() {
            let nextIndex;
            // Ensure the next random card isn't the exact same card as current
            do {
                nextIndex = Math.floor(Math.random() * elementsData.length);
            } while (nextIndex === currentIndex && elementsData.length > 1);
            return nextIndex;
        }

        function updateCard() {
            const el = elementsData[currentIndex];
            frontNumber.innerText = `#${el.number}`;
            backSymbol.innerText = el.symbol;
            backName.innerText = el.name;
            backDetails.innerHTML = `<strong>Category:</strong> ${el.category}<br><em>"${el.fact}"</em>`;
            
            cardProgress.innerText = `Card Seen: ${cardsSeen} / ${elementsData.length}`;
            scoreTracker.innerText = `Mastered: ${masteredCount}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            generateRandomTheme();
            flashcard.classList.toggle('flipped', isFlipped);
        }

        function nextCard() {
            cardsSeen++;
            generateRandomTheme();
            const newIndex = pickRandomIndex();

            if (isFlipped) {
                isFlipped = false;
                flashcard.classList.remove('flipped');
                setTimeout(() => {
                    currentIndex = newIndex;
                    updateCard();
                }, 250);
            } else {
                currentIndex = newIndex;
                updateCard();
            }
        }

        cardContainer.addEventListener('click', flipCard);

        document.getElementById('gotItBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (masteredCount < elementsData.length) {
                masteredCount++;
            }
            nextCard();
        });

        document.getElementById('retryBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            nextCard();
        });

        document.getElementById('shuffleBtn').addEventListener('click', () => {
            nextCard();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            masteredCount = 0;
            cardsSeen = 1;
            currentIndex = pickRandomIndex();
            generateRandomTheme();
            if (isFlipped) flipCard();
            updateCard();
        });

        // Keyboard navigation setup
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                flipCard();
            } else if (e.code === 'ArrowRight') {
                document.getElementById('gotItBtn').click();
            } else if (e.code === 'ArrowLeft') {
                document.getElementById('retryBtn').click();
            }
        });

        // Initial setup
        cardsSeen = 1;
        currentIndex = pickRandomIndex();
        generateRandomTheme();
        updateCard();
    </script>
</body>
</html>
