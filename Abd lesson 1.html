    // Audio Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            // Water drop / Bell sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'wrong') {
            // Low thud
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'fanfare') {
            // Victory Arpeggio
            [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'triangle';
                o.frequency.value = freq;
                const st = now + (i * 0.1);
                g.gain.setValueAtTime(0.1, st);
                g.gain.exponentialRampToValueAtTime(0.01, st + 0.4);
                o.start(st);
                o.stop(st + 0.4);
            });
        }
    }

            options: ["A) वनवास", "B) पंचतंत्र", "C) पंकज", "D) चंद्रमुख"],
            a: 1, // B
            t: "సరైన సమాధానం: B (పంచతంత్ర).<br>'పంచతంత్ర' లో మొదటి పదం 'పంచ' (ఐదు - Number), కాబట్టి ఇది ద్విగు సమాసం."
        }
    ];

    let currentScore = 0;
    let currentQIndex = 0;
    const container = document.getElementById('quiz-container');
    const scoreDisplay = document.getElementById('score');
    const qCountDisplay = document.getElementById('current-q');
    const progressBar = document.getElementById('progress-bar');
    const resultScreen = document.getElementById('result-screen');
    const quizUi = document.getElementById('quiz-ui');

    function loadQuestion(index) {
        if (index >= questions.length) {
            showResult();
            return;
        }

        const q = questions[index];
        container.innerHTML = '';

        const card = document.createElement('div');
        card.className = 'question-card';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerHTML = q.q;
        card.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-grid';

        const explanationDiv = document.createElement('div');
        explanationDiv.className = 'explanation';
        explanationDiv.innerHTML = `<h4>వివరణ (Explanation):</h4><p>${q.t}</p>`;
        
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn';
        nextBtn.textContent = index === questions.length - 1 ? "Check Result 🏆" : "Next Question ➡";
        nextBtn.onclick = () => {
            currentQIndex++;
            loadQuestion(currentQIndex);
        };

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => {
                const allBtns = optionsDiv.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.classList.add('disabled'));
                
                if (i === q.a) {
                    btn.classList.add('correct');
                    currentScore++;
                    scoreDisplay.textContent = currentScore;
                    playSound('correct');
                } else {
                    btn.classList.add('wrong');
                    allBtns[q.a].classList.add('correct');
                    playSound('wrong');
                }
                
                explanationDiv.style.display = 'block';
                nextBtn.style.display = 'block';
            };
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);
        card.appendChild(explanationDiv);
        card.appendChild(nextBtn);
        container.appendChild(card);

        qCountDisplay.textContent = index + 1;
        const progress = ((index) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
    }

    function showResult() {
        quizUi.style.display = 'none';
        resultScreen.style.display = 'block';
        
        document.getElementById('final-score').textContent = `${currentScore} / ${questions.length}`;
        
        const percentage = (currentScore / questions.length) * 100;
        let msg = "";
        
        if (percentage >= 90) {
            msg = "अद्भुत! (Wonderful!) 🌧️<br>आपने 'बरसते बादल' पाठ को बहुत अच्छे से समझा है!";
            playSound('fanfare');
        } else if (percentage >= 70) {
            msg = "बहुत अच्छा! (Very Good!) 🎉<br>आपकी हिंदी व्याकरण अच्छी है।";
            playSound('correct');
        } else if (percentage >= 50) {
            msg = "अच्छा प्रयास! (Good Effort) 👍<br>थोड़ा और अभ्यास करें।";
        } else {
            msg = "कोई बात नहीं! (Keep Learning)<br>पाठ को दोबारा पढ़ें और प्रयास करें।";
        }
        
        const msgDiv = document.getElementById('congrats-msg');
        msgDiv.innerHTML = msg;
    }

    loadQuestion(0);
</script>

</body>
